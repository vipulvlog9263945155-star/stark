<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>VIPUL AI — Spider Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --spider-red:#ff2d55;
  --spider-blue:#0066ff;
  --spider-cyan:#00e5ff;
  --gold:#fbbf24;
  --win:#22c55e;
  --dark:#08060e;
  --muted:#8b8da8;
  --txt:#f8f7ff;
  --font-main:'Poppins',sans-serif;
  --font-tech:'Orbitron',sans-serif;
  --font-display:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-main);color:var(--txt);
  background:var(--dark);
  background-image:
    radial-gradient(circle at 10% 12%, rgba(255,45,85,.24), transparent 42%),
    radial-gradient(circle at 90% 20%, rgba(0,102,255,.28), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(0,229,255,.14), transparent 50%);
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g stroke='%23ffffff' stroke-opacity='0.035' stroke-width='0.5' fill='none'><line x1='120' y1='0' x2='120' y2='240'/><line x1='0' y1='120' x2='240' y2='120'/><line x1='40' y1='40' x2='200' y2='200'/><line x1='200' y1='40' x2='40' y2='200'/><circle cx='120' cy='120' r='35'/><circle cx='120' cy='120' r='70'/><circle cx='120' cy='120' r='105'/></g></svg>");
  background-repeat:repeat;pointer-events:none;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.1));
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.1));
}

/* SPIDERMAN LOADER */
#spiderLoader{
  position:fixed;inset:0;z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%, rgba(255,45,85,.22), transparent 60%),
             radial-gradient(ellipse at 80% 80%, rgba(0,102,255,.22), transparent 60%),
             #08060e;
  transition:opacity .5s ease-out;
}
#spiderLoader::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400' viewBox='0 0 400 400'><g stroke='%23ffffff' stroke-opacity='0.06' stroke-width='0.8' fill='none'><line x1='200' y1='0' x2='200' y2='400'/><line x1='0' y1='200' x2='400' y2='200'/><line x1='60' y1='60' x2='340' y2='340'/><line x1='340' y1='60' x2='60' y2='340'/><line x1='120' y1='0' x2='280' y2='400'/><line x1='280' y1='0' x2='120' y2='400'/><line x1='0' y1='120' x2='400' y2='280'/><line x1='0' y1='280' x2='400' y2='120'/><circle cx='200' cy='200' r='40'/><circle cx='200' cy='200' r='80'/><circle cx='200' cy='200' r='120'/><circle cx='200' cy='200' r='160'/></g></svg>");
  background-position:center;background-repeat:no-repeat;
  animation:webPulse 4s ease-in-out infinite;opacity:.5;
}
@keyframes webPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.03);opacity:.6}}
.spider-loader-box{position:relative;display:flex;flex-direction:column;align-items:center;padding:30px;z-index:1}
.web-spinner{position:relative;width:130px;height:130px;margin-bottom:28px;display:grid;place-items:center}
.web-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;filter:drop-shadow(0 0 10px currentColor)}
.web-ring.r1{border-top-color:#ff2d55;border-right-color:#ff2d55;color:#ff2d55;animation:spin 1.3s linear infinite}
.web-ring.r2{inset:12px;border-bottom-color:#0066ff;border-left-color:#0066ff;color:#0066ff;animation:spinRev 1.6s linear infinite}
.web-ring.r3{inset:24px;border-top-color:#00e5ff;border-right-color:#00e5ff;color:#00e5ff;animation:spin 1.9s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes spinRev{100%{transform:rotate(-360deg)}}
.spider-icon{font-size:48px;z-index:2;animation:spiderBob 2s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,45,85,.9))}
@keyframes spiderBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-8deg)}}
.loader-title{
  font-family:var(--font-tech);font-size:22px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(135deg,#ff2d55,#ffffff,#0066ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,45,85,.4));
  margin-bottom:6px;text-align:center;
}
.loader-sub{font-size:10px;letter-spacing:3px;color:#a5a5c5;font-weight:800;margin-bottom:26px;text-align:center;animation:subPulse 1.5s ease-in-out infinite}
@keyframes subPulse{0%,100%{opacity:.6}50%{opacity:1}}
.loader-bar{width:240px;height:6px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden;position:relative;box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.loader-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff2d55,#a855f7,#0066ff,#00e5ff,#ff2d55);background-size:300% 100%;border-radius:10px;animation:gradientShift 2.5s linear infinite;box-shadow:0 0 12px rgba(255,45,85,.6),0 0 24px rgba(0,102,255,.4);transition:width .15s linear}
@keyframes gradientShift{0%{background-position:0% 0}100%{background-position:300% 0}}
.loader-percent{margin-top:12px;font-family:var(--font-tech);font-size:16px;font-weight:900;color:#ff2d55;letter-spacing:2px;text-shadow:0 0 12px rgba(255,45,85,.8);font-variant-numeric:tabular-nums}

/* MAINTENANCE (NO OK BUTTON) */
#maintenanceLock{position:fixed;inset:0;z-index:1000000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,4,8,.98);backdrop-filter:blur(6px)}
#maintenanceLock.show{display:flex}
.lock-card{max-width:360px;width:100%;padding:32px 24px;text-align:center;border:1px solid rgba(255,211,106,.4);border-radius:20px;background:linear-gradient(150deg,#1b1017,#08090d);box-shadow:0 0 40px rgba(255,45,85,.2)}
.lock-icon{font-size:56px;margin-bottom:14px;animation:spin 3s linear infinite;filter:drop-shadow(0 0 20px rgba(255,211,106,.6));display:inline-block}
.lock-title{font-family:var(--font-tech);font-size:19px;font-weight:900;color:var(--gold);margin-bottom:12px;letter-spacing:2px}
.lock-msg{font-size:13px;color:#ddd;line-height:1.7}

/* WIN / SKIP OVERLAYS */
#winOverlay{position:fixed;inset:0;background:rgba(5,5,15,.9);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s;backdrop-filter:blur(10px)}
#winOverlay.show{display:flex;opacity:1}
.win-trophy{font-size:130px;animation:winPop .6s cubic-bezier(.175,.885,.32,1.275) forwards;filter:drop-shadow(0 0 40px rgba(0,229,255,.9))}
.win-text{font-family:var(--font-display);font-size:48px;font-weight:700;letter-spacing:8px;margin-top:10px;background:linear-gradient(135deg,#00e5ff,#0066ff 50%,#ff2d55);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(0,102,255,.7));animation:slideUp .5s ease-out forwards}
@keyframes winPop{0%{transform:scale(0) rotate(-45deg)}100%{transform:scale(1) rotate(0)}}
@keyframes slideUp{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
#skipOverlay{position:fixed;inset:0;background:rgba(5,5,15,.9);z-index:9998;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s;backdrop-filter:blur(10px)}
#skipOverlay.show{display:flex;opacity:1}
.skip-icon-big{font-size:120px;color:#fbbf24;line-height:1;filter:drop-shadow(0 0 40px rgba(251,191,36,.9));animation:skipIconPop .7s cubic-bezier(.175,.885,.32,1.275) forwards}
.skip-text-big{font-family:var(--font-display);font-size:52px;font-weight:700;letter-spacing:10px;color:#fbbf24;margin-top:12px;animation:skipTextPulse 1s ease-in-out infinite}
.skip-sub{font-family:var(--font-tech);font-size:12px;color:#00e5ff;margin-top:14px;letter-spacing:4px;text-shadow:0 0 12px #00e5ff}
@keyframes skipIconPop{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes skipTextPulse{0%,100%{text-shadow:0 0 20px #fbbf24,0 0 40px #fbbf24;transform:scale(1)}50%{text-shadow:0 0 30px #fbbf24,0 0 60px #fbbf24;transform:scale(1.05)}}

/* MAIN APP 25/75 */
#mainApp{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;animation:fadeIn .55s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#topPanel{
  flex:0 0 25%;height:25%;min-height:0;
  padding:6px 8px;
  display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(180deg,rgba(20,10,22,.9),rgba(8,6,14,.98));
  border-bottom:1px solid rgba(255,45,85,.4);
  overflow:hidden;
}
.top-header{
  background:linear-gradient(135deg,rgba(255,45,85,.12),rgba(0,102,255,.12));
  border:1px solid rgba(255,45,85,.28);
  border-radius:10px;padding:5px 10px;flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
.brand-name{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.5px;background:linear-gradient(135deg,#ff2d55 0%,#ffffff 50%,#0066ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,45,85,.4))}
.mode-toggle{display:flex;gap:2px;background:rgba(0,0,0,.45);padding:2px;border-radius:6px;border:1px solid rgba(255,45,85,.22)}
.mode-btn{padding:3px 7px;border-radius:5px;font-family:var(--font-tech);font-size:7.5px;font-weight:900;letter-spacing:.3px;background:transparent;color:var(--muted);border:none;cursor:pointer;transition:all .2s}
.mode-btn.active{color:#fff;background:linear-gradient(135deg,#ff2d55,#0066ff);box-shadow:0 0 8px rgba(255,45,85,.55)}

.panel-content{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

#uidBox{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;text-align:center}
.uid-logo{font-family:var(--font-tech);font-size:13px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#ff2d55,#ffffff,#0066ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,45,85,.5))}
.uid-sub{font-size:6.5px;letter-spacing:1.5px;color:#a5a5c5;font-weight:800}
.uid-input-group{display:flex;gap:3px;width:100%;max-width:280px;margin-top:3px;background:rgba(5,6,10,.85);padding:3px;border-radius:7px;border:1px solid rgba(255,45,85,.35);box-shadow:inset 0 0 10px rgba(0,0,0,.7)}
.uid-input-group:focus-within{border-color:#ff2d55;box-shadow:inset 0 0 10px rgba(0,0,0,.7),0 0 12px rgba(255,45,85,.3)}
.uid-input{flex:1;padding:5px 6px;background:transparent;border:none;color:#ffd0d8;font-family:var(--font-tech);font-size:11px;font-weight:900;text-align:center;letter-spacing:2.5px;outline:none}
.uid-input::placeholder{color:#666;letter-spacing:1px;font-family:var(--font-main);font-size:9px;font-weight:600}
.uid-input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.uid-btn{padding:0 10px;border-radius:5px;border:none;background:linear-gradient(135deg,#ff2d55,#0066ff);color:#fff;font-family:var(--font-tech);font-size:8px;font-weight:900;letter-spacing:.3px;cursor:pointer;box-shadow:0 0 8px rgba(255,45,85,.4);min-width:60px;position:relative;overflow:hidden}
.uid-btn.loading{color:transparent;pointer-events:none}
.uid-btn.loading::after{content:'';position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.uid-msg{font-size:7.5px;font-weight:800;min-height:9px;letter-spacing:.5px;color:#ff2d55;text-align:center;line-height:1.2;padding:0 4px}

#connectingState{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(26,10,20,.98),rgba(8,6,14,.98));border-radius:10px}
#connectingState.show{display:flex}
.connect-spinner{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,45,85,.15);border-top-color:#ff2d55;border-right-color:#0066ff;animation:spin 1s linear infinite;margin-bottom:8px;filter:drop-shadow(0 0 8px rgba(255,45,85,.6))}
.connect-check{font-size:26px;margin-bottom:4px;display:none;animation:popCheck .4s cubic-bezier(.175,.885,.32,1.275) forwards;filter:drop-shadow(0 0 12px rgba(34,197,94,.9))}
@keyframes popCheck{0%{transform:scale(0)}100%{transform:scale(1)}}
.connect-text{font-family:var(--font-tech);font-size:8.5px;font-weight:900;color:#ff2d55;letter-spacing:1.5px;text-shadow:0 0 8px rgba(255,45,85,.6);animation:subPulse 1s ease-in-out infinite}

#verifiedContent{display:none;flex-direction:column;height:100%}
#verifiedContent.show{display:flex}

.prediction-panel{
  flex:1;min-height:0;
  background:linear-gradient(145deg,rgba(24,18,36,.92),rgba(8,6,14,.94));
  border:1px solid rgba(255,45,85,.28);border-radius:12px;
  padding:6px 10px;
  display:flex;flex-direction:column;gap:3px;
  box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
.top-info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
#periodId{font-size:8px;color:var(--muted);font-family:var(--font-tech);font-weight:700;letter-spacing:.3px;opacity:.85;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.timer-ring{
  --progress:0deg;position:relative;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
  background:conic-gradient(from -90deg,#ff2d55 0deg,#ff2d55 calc(var(--progress) * .5),#a855f7 calc(var(--progress) * .75),#0066ff var(--progress),rgba(255,255,255,.06) var(--progress));
  box-shadow:0 0 12px rgba(255,45,85,.4),0 0 20px rgba(0,102,255,.15),inset 0 0 12px rgba(0,0,0,.35);
  transition:box-shadow .3s;animation:timerBreath 3s ease-in-out infinite;
}
@keyframes timerBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.timer-ring::before{content:'';position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#1a0a20,#08060e 70%);box-shadow:inset 0 1px 4px rgba(0,0,0,.85)}
.timer-ring span{position:relative;z-index:3;font-family:var(--font-tech);font-size:11px;font-weight:900;color:#fff;text-shadow:0 0 6px rgba(0,229,255,.9);letter-spacing:.2px}
.timer-ring.urgent{animation:timerUrgent .85s ease-in-out infinite}
.timer-ring.urgent span{color:#ff2d55;text-shadow:0 0 8px #ff2d55,0 0 16px rgba(255,45,85,.7)}
@keyframes timerUrgent{0%,100%{box-shadow:0 0 14px rgba(255,45,85,.6),0 0 28px rgba(255,45,85,.28);transform:scale(1)}50%{box-shadow:0 0 22px rgba(255,45,85,1),0 0 44px rgba(255,45,85,.5);transform:scale(1.06)}}

.pred-label{font-size:8px;letter-spacing:2.5px;font-weight:800;text-align:center;font-family:var(--font-display);text-transform:uppercase;background:linear-gradient(135deg,#ff2d55,#ffffff,#0066ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 5px rgba(255,45,85,.3));flex-shrink:0}
.pred-value{font-family:var(--font-display);font-size:32px;font-weight:700;text-align:center;line-height:1;letter-spacing:1px;flex-shrink:0;margin:-1px 0}
.pred-value.B{background:linear-gradient(135deg,#00e5ff 0%,#0066ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(0,102,255,.7));animation:neonFloat 3s ease-in-out infinite}
.pred-value.S{background:linear-gradient(135deg,#ff6b8a 0%,#ff2d55 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,45,85,.7));animation:neonFloat 3s ease-in-out infinite}
.pred-value.WAIT{color:#4b4b63;font-size:20px}
.pred-value.SKIP{background:linear-gradient(135deg,#fbbf24,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px;filter:drop-shadow(0 0 10px rgba(251,191,36,.6))}
@keyframes neonFloat{0%,100%{transform:translateY(0);filter:brightness(1)}50%{transform:translateY(-1px);filter:brightness(1.12)}}

.level-row{display:flex;justify-content:space-between;gap:6px;flex-shrink:0;margin-top:1px}
.l-box{flex:1;background:linear-gradient(135deg,rgba(255,45,85,.10),rgba(0,102,255,.10));border:1px solid rgba(255,45,85,.24);border-radius:7px;padding:3px 8px;display:flex;justify-content:space-between;align-items:center;min-width:0}
.l-title{font-size:7px;color:var(--muted);font-weight:800;letter-spacing:.4px;font-family:var(--font-display);white-space:nowrap}
.l-val{font-family:var(--font-tech);font-size:11.5px;font-weight:900;background:linear-gradient(135deg,#ff2d55,#0066ff);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-flex;align-items:baseline;gap:2px}
.l-count{font-family:var(--font-tech);font-size:9px;font-weight:900;color:#6a6a7d;-webkit-text-fill-color:#6a6a7d;letter-spacing:0}

.boxes{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;flex-shrink:0;margin-top:2px}
.box{height:16px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#4b4b63;transition:all .3s;font-family:var(--font-tech)}
.box.B{background:linear-gradient(135deg,rgba(0,229,255,.28),rgba(0,102,255,.28));color:#b8ecff;border-color:rgba(0,229,255,.7);box-shadow:0 0 6px rgba(0,102,255,.35)}
.box.S{background:linear-gradient(135deg,rgba(255,107,138,.28),rgba(255,45,85,.28));color:#ffd0d8;border-color:rgba(255,45,85,.7);box-shadow:0 0 6px rgba(255,45,85,.35)}

#bottomPanel{flex:1;min-height:0;background:#000;position:relative;border-top:1px solid rgba(255,45,85,.4);box-shadow:0 -6px 24px rgba(255,45,85,.12);display:flex;flex-direction:column}
#gameIframe{flex:1;width:100%;min-height:0;border:none;background:#111;display:block;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="maintenanceLock">
  <div class="lock-card">
    <div class="lock-icon">⚙️</div>
    <div class="lock-title">SYSTEM UPDATING</div>
    <div class="lock-msg">Please try again later.</div>
  </div>
</div>

<div id="spiderLoader">
  <div class="spider-loader-box">
    <div class="web-spinner">
      <div class="web-ring r1"></div>
      <div class="web-ring r2"></div>
      <div class="web-ring r3"></div>
      <div class="spider-icon">🕷️</div>
    </div>
    <div class="loader-title">VIPUL AI</div>
    <div class="loader-sub" id="loaderSub">SPIDER ENGINE INITIALIZING...</div>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-percent" id="loaderPercent">0%</div>
  </div>
</div>

<div id="winOverlay"><div class="win-trophy">🏆</div><div class="win-text">WIN !</div></div>
<div id="skipOverlay">
  <div class="skip-icon-big">⊘</div>
  <div class="skip-text-big">SKIP</div>
  <div class="skip-sub">NEXT 2 PERIODS</div>
</div>

<div id="mainApp">
  <div id="topPanel">
    <div class="top-header">
      <div class="brand-name">VIPUL BHAI</div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="oneMinBtn" onclick="switchMode('1min')">1 MIN</button>
        <button class="mode-btn" id="thirtySecBtn" onclick="switchMode('30sec')">30 SEC</button>
      </div>
    </div>

    <div class="panel-content">
      <div id="uidBox">
        <div class="uid-logo">VIPUL AI</div>
        <div class="uid-sub">SPIDER ACCESS • SECURE UID</div>
        <div class="uid-input-group">
          <input type="text" id="uidInput" class="uid-input" placeholder="ENTER UID" inputmode="numeric" maxlength="10" autocomplete="off">
          <button id="connectBtn" class="uid-btn">CONNECT</button>
        </div>
        <div id="uidMsg" class="uid-msg"></div>

  }
  // ✅ Reverse on every odd level from 3 (L3, L5, L7, L9, L11...)
  let isReverse = false, originalValue = null;
  if (finalVal && currentLevel >= 3 && currentLevel % 2 === 1) {
    originalValue = finalVal;
    finalVal = finalVal === 'B' ? 'S' : 'B';
    isReverse = true;
  }
  if(finalVal && (finalVal==='B' || finalVal==='S')){
    pendingForecast = {
      periodId: currentTarget, value: finalVal, originalValue: originalValue,
      isSkip: false, isLevelSkip: false, isReverse: isReverse

/* API */
function extractApiRows(payload){
  const found=[],seen=new Set();
  function walk(node,depth=0){
    if(!node||typeof node!=='object'||depth>8||seen.has(node))return;
    seen.add(node);
    if(Array.isArray(node)){for(const item of node)walk(item,depth+1);return;}
    const issueRaw=node.issueNumber??node.issue_number??node.issue??node.period??node.periodNumber??node.issue_no??node.drawId??node.draw_id;
    const raw=node.number??node.resultNumber??node.result_number??node.result??node.openNumber??node.open_number??node.winNumber??node.winningNumber;
    if(issueRaw!==undefined&&raw!==undefined){
      const issue=String(issueRaw).trim();
      const match=String(raw).match(/(?:^|\D)([0-9])(?:\D|$)/);
      const number=match?Number(match[1]):NaN;
      if(issue&&Number.isFinite(number)&&number>=0&&number<=9)found.push({issue,number,value:number>=5?'B':'S'});
    }
    Object.values(node).forEach(v=>walk(v,depth+1));
  }
  walk(payload);
  const unique=[...new Map(found.map(r=>[r.issue,r])).values()];
  unique.sort((a,b)=>{
    if(/^\d+$/.test(a.issue)&&/^\d+$/.test(b.issue)){const aa=BigInt(a.issue),bb=BigInt(b.issue);return aa<bb?-1:aa>bb?1:0;}
    return a.issue.localeCompare(b.issue,undefined,{numeric:true});
  });
  return unique;
}

function processApiRow(r){
  if (pendingForecast && pendingForecast.periodId === r.issue) {
    if (pendingForecast.isSkip) {
      history.push({ periodId: pendingForecast.periodId, predicted: '-', actual: r.value, correct: null, wasSkip: true });
      if (pendingForecast.isLevelSkip) skipRemaining = Math.max(0, skipRemaining - 1);
    } else {
      const wasCorrect = pendingForecast.value === r.value;
      history.push({ periodId: pendingForecast.periodId, predicted: pendingForecast.value, actual: r.value, correct: wasCorrect });
      if (wasCorrect) {
        triggerWinAnimation();
        currentLevel = 1;
        consecutiveLosses = 0;
      } else {
        // ✅ Level always increments until WIN. Skip on 2 consecutive losses.
        consecutiveLosses++;
        currentLevel++;
        if (currentLevel > highestLevel) {
          highestLevel = currentLevel;
          highestLevelCount = 1;
        } else if (currentLevel === highestLevel) {
          highestLevelCount++;
        }
        if (consecutiveLosses >= 2) {
          skipRemaining = 2;
          consecutiveLosses = 0;
          triggerSkipAnimation();
        }
      }
    }
  } else if (pendingForecast) {
    history.push({ periodId: pendingForecast.periodId, predicted: pendingForecast.value, actual: null, correct: null, wasSkip: true });
    if (pendingForecast.isLevelSkip) skipRemaining = Math.max(0, skipRemaining - 1);
  }
  pendingForecast = null;
  allResults.push(r.value);
  allNumbers.push(r.number);
  if (mode === 'setup') {
    const idx = window10.findIndex(x => x === null);
    if (idx !== -1) { window10[idx] = r.value; if (window10.every(x => x !== null)) mode = 'rolling'; }
  } else { window10.pop(); window10.unshift(r.value); }
  const nums = latestApiResults.map(res => String(res.number));
  chartNum1 = nums.join('').slice(0, 2) === '' ? null : Number(nums.join('').slice(0, 2));
}

async function pollGameAPI(){
  if(apiBusy)return;
  apiBusy=true;
  const url = gameMode==='1min'?'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json':'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json';
  try{
    const response=await fetch(url,{method:'GET',cache:'no-store'});
    if(!response.ok)throw new Error('HTTP');
    const payload=await response.json();
    const rows=extractApiRows(payload);
    if(!rows.length)throw new Error('No rows');
    const last=rows[rows.length-1];
    latestApiResults=rows.slice(-2).reverse();
    if(!apiSeeded[gameMode]){
      const recent=rows.slice(-TOTAL).reverse();
      window10=new Array(TOTAL).fill(null);
      recent.forEach((r,i)=>{window10[i]=r.value;});
      allResults = rows.map(r => r.value);
      allNumbers = rows.map(r => r.number);
      mode=recent.length===TOTAL?'rolling':'setup';
      apiLastIssue[gameMode]=last.issue;
      apiSeeded[gameMode]=true;
      const nums = latestApiResults.map(res => String(res.number));
      chartNum1 = nums.join('').slice(0,2) === '' ? null : Number(nums.join('').slice(0,2));
      updatePrediction();
      updateTimerAndPeriod();
      renderAll();
    }else if(apiLastIssue[gameMode]!==last.issue){
      let fresh=rows.filter(r=>{
        if(/^\d+$/.test(r.issue)&&/^\d+$/.test(String(apiLastIssue[gameMode]||'')))return BigInt(r.issue)>BigInt(apiLastIssue[gameMode]);
        return String(r.issue).localeCompare(String(apiLastIssue[gameMode]||''),undefined,{numeric:true})>0;
      });
      fresh.sort((a,b) => String(a.issue).localeCompare(String(b.issue), undefined, {numeric: true}));
      if(!fresh.length)fresh=[last];
      fresh.forEach(r=>{ processApiRow(r); apiLastIssue[gameMode] = r.issue; updatePrediction(); });
      apiLastIssue[gameMode]=last.issue;
      updateTimerAndPeriod();
      renderAll();
    }
  }catch(err){ console.warn('API sync failed'); }
  finally{apiBusy=false}
}

function startApiPolling(){

      if(connSpinner)connSpinner.style.display = 'block';
      if(connCheck)connCheck.style.display = 'none';
      if(connectText){ connectText.style.color='#ff2d55'; connectText.textContent = 'VERIFYING UID...'; }
      setTimeout(()=>{ if(attempt === accessAttempt && connectText) connectText.textContent = 'CONNECTING TO SERVER...'; }, 1200);
      setTimeout(()=>{
        if(attempt !== accessAttempt || !window.isVerified) return;
        if(connSpinner)connSpinner.style.display = 'none';
        if(connCheck)connCheck.style.display = 'block';
        if(connectText){ connectText.textContent = 'ACCESS GRANTED'; connectText.style.color = '#22c55e'; connectText.style.textShadow = '0 0 12px rgba(34,197,94,.7)'; }
      }, 2500);
      setTimeout(()=>{
        if(attempt !== accessAttempt || !window.isVerified) return;
        connectingState.classList.remove('show');
        verifiedContent.classList.add('show');
        connectBtn.disabled = false;
        renderAll();
      }, 3200);
    } catch(err){
      connectBtn.classList.remove('loading');
      connectBtn.disabled = false;
      uidMsg.textContent = 'SERVER CHECK FAILED — PLEASE TRY AGAIN';
      uidMsg.style.color = 'var(--spider-red)';
      console.error('Access check failed', err);
    }
  });
  uidInput.addEventListener('keypress', (e)=>{ if(e.key === 'Enter') connectBtn.click(); });
}

/* INIT */
setInterval(updateTimerAndPeriod, 1000);
updateTimerAndPeriod();
renderBoxes();
startApiPolling();
</script>
